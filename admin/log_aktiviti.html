<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aktiviti | ALK System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/log_aktiviti.css">
</head>
<body>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- MOBILE TOPBAR -->
<div class="mobile-topbar">
  <button class="burger-btn" id="burger-btn" onclick="toggleSidebar()" aria-label="Menu">
    <i class="ti ti-menu-2"></i>
  </button>
  <span class="mobile-page-title">Log Aktiviti</span>
</div>



<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo-wrap">
      <img src="../image/ALK.png" alt="Logo ALK" class="sidebar-logo">
      <div class="sidebar-logo-text">
        <span class="sidebar-logo-title">E-ALK</span>
        <span class="sidebar-logo-sub">Admin</span>
      </div>
    </div>
  </div>  
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="ti ti-layout-dashboard"></i> Laman Utama
    </a>
    <a href="rekod_kehadiran.html" class="nav-item">
      <i class="ti ti-clipboard-check"></i> Rekod Kehadiran
    </a>
    <a href="penyata.html" class="nav-item">
      <i class="ti ti-file-analytics"></i> Penyata
    </a>
    <a href="direktori.html" class="nav-item">
      <i class="ti ti-users"></i> Direktori
    </a>
    <a href="urus_user.html" class="nav-item">
      <i class="ti ti-user-cog"></i> Tetapan Pengguna
    </a>
    <a href="log_aktiviti.html" class="nav-item active">
      <i class="ti ti-history"></i> Log Aktiviti
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="status-badge" id="user-status-badge">
      Pentadbir Sistem
    </div>
    <button type="button" onclick="Auth.logout()" class="btn-logout">Logout</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

  <div class="topbar">
    <div class="topbar-left">
      <div class="page-label">Admin</div>
      <h1>Log Aktiviti</h1>
    </div>
  </div>

  <!-- SEARCH & FILTER PANEL -->
  <div class="filter-panel">
    <div class="filter-panel-row">
      <div class="filter-field" style="flex:2;">
        <span class="filter-field-label"><i class="ti ti-search"></i> Carian</span>
        <input type="text" id="cari-input" placeholder="Aksi, butiran, username..." />
      </div>
      <div class="filter-field">
        <span class="filter-field-label"><i class="ti ti-calendar"></i> Tarikh</span>
        <input type="date" id="tarikh-input" />
      </div>
      <div class="filter-field">
        <span class="filter-field-label"><i class="ti ti-list-numbers"></i> Muka Surat</span>
        <select id="per-page-select" onchange="changePerPage(this.value)">
          <option value="25" selected>25 per muka surat</option>
          <option value="10">10 per muka surat</option>
          <option value="50">50 per muka surat</option>
          <option value="100">100 per muka surat</option>
        </select>
      </div>
    </div>
    <div class="filter-btn-row" style="margin-top:10px;">
      <button type="button" class="btn-primary" onclick="currentPage = 1; renderLogs();"><i class="ti ti-search"></i> Cari</button>
      <button type="button" class="btn-secondary" onclick="resetFilter()"><i class="ti ti-refresh"></i> Reset</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <h2>Rekod Aktiviti (<span id="log-count">0</span>)</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tarikh & Masa</th>
          <th>Admin</th>
          <th>Aksi</th>
          <th class="hide-mobile">Butiran</th>
        </tr>
      </thead>
      <tbody id="log-table-body">
        <!-- Rendered dynamically -->
      </tbody>
    </table>

    <!-- PAGINATION WRAPPER -->
    <div class="pagination-wrapper" id="pagination-wrapper">
      <div class="pagination-info" id="pagination-info"></div>
      <div class="pagination-controls" id="pagination-controls"></div>
    </div>
  </div>

</div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  const currentUser = Auth.requireAuth(['admin']);
  if (currentUser) {
    document.getElementById('user-status-badge').innerHTML = `${currentUser.nama}<br>${currentUser.bahagian}`;
  }

  let currentPage = 1;
  let itemsPerPage = 25;

  function changePerPage(val) {
    itemsPerPage = parseInt(val, 10);
    currentPage = 1;
    renderLogs();
  }

  function resetFilter() {
    document.getElementById('cari-input').value = '';
    document.getElementById('tarikh-input').value = '';
    document.getElementById('per-page-select').value = '25';
    itemsPerPage = 25;
    currentPage = 1;
    renderLogs();
  }

  function goToPage(pageNum) {
    currentPage = pageNum;
    renderLogs();
  }

  function renderLogs() {
    const cariVal = document.getElementById('cari-input').value.toLowerCase().trim();
    const tarikhVal = document.getElementById('tarikh-input').value;

    const logs = Store.get(STORAGE_KEYS.LOG_AKTIVITI, []);
    const users = Store.get(STORAGE_KEYS.USERS, []);

    let filtered = logs.filter(log => {
      const u = users.find(user => user.id === log.user_id) || { nama: 'System', username: 'system' };
      log._userName = u.nama;
      log._userUsername = u.username;

      if (tarikhVal) {
        const logDateStr = new Date(log.created_at).toISOString().split('T')[0];
        if (logDateStr !== tarikhVal) return false;
      }

      if (cariVal) {
        const matchAksi = (log.aksi || '').toLowerCase().includes(cariVal);
        const matchButiran = (log.butiran || '').toLowerCase().includes(cariVal);
        const matchUser = (u.username || '').toLowerCase().includes(cariVal) || (u.nama || '').toLowerCase().includes(cariVal);
        return matchAksi || matchButiran || matchUser;
      }

      return true;
    });

    const totalItems = filtered.length;
    document.getElementById('log-count').textContent = totalItems;
    const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
    const pagedLogs = filtered.slice(startIndex, endIndex);

    const tbody = document.getElementById('log-table-body');
    tbody.innerHTML = '';

    if (totalItems === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align:center; color:#94a3b8; padding:2rem; font-weight:600;">Tiada rekod aktiviti dijumpai.</td>
        </tr>
      `;
      document.getElementById('pagination-info').textContent = 'Menunjukkan 0 daripada 0 rekod';
      document.getElementById('pagination-controls').innerHTML = '';
      return;
    }

    pagedLogs.forEach(log => {
      const formattedDate = new Date(log.created_at).toLocaleString('ms-MY');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formattedDate}</td>
        <td><strong>${log._userName}</strong><br><span style="color:#4a6741;font-size:10px;">(${log._userUsername})</span></td>
        <td><span class="badge-aksi">${log.aksi}</span></td>
        <td class="hide-mobile" style="font-size:11px;color:#8a9e82;max-width:180px;word-break:break-word;">${log.butiran}</td>
      `;
      tbody.appendChild(tr);
    });

    // Pagination Info
    document.getElementById('pagination-info').innerHTML = `Menunjukkan <span>${startIndex + 1}</span> hingga <span>${endIndex}</span> daripada <span>${totalItems}</span> rekod`;

    // Pagination Controls
    let controlsHtml = '';
    
    controlsHtml += `<button type="button" class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹ Sebelumnya</button>`;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        controlsHtml += `<button type="button" class="btn-page ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        controlsHtml += `<span style="color:#64748b; padding:0 4px;">...</span>`;
      }
    }

    controlsHtml += `<button type="button" class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Seterusnya ›</button>`;

    document.getElementById('pagination-controls').innerHTML = controlsHtml;
  }

  renderLogs();
</script>


<script>
  /* ── Burger / Sidebar Toggle ── */
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      closeSidebar();
    } else {
      sidebar.classList.add('open');
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  }

  /* Close sidebar when a nav link is clicked on mobile */
  document.querySelectorAll('.nav-item').forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.innerWidth <= 768) closeSidebar();
    });
  });

  /* Close on resize to desktop */
  window.addEventListener('resize', function() {
    if (window.innerWidth > 768) {
      document.querySelector('.sidebar').classList.remove('open');
      const overlay = document.getElementById('sidebar-overlay');
      if (overlay) overlay.classList.remove('show');
      document.body.style.overflow = '';
    }
  });
</script>

</body>
</html>
