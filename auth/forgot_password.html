<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Kata Laluan | ALK System</title>
  <link rel="stylesheet" href="../css/forgot_password.css">
</head>
<body>

<div class="auth-card">
  <h2><i>🔑</i> Reset Kata Laluan</h2>
  <p>Masukkan username anda untuk hantar permintaan reset kepada Admin Sistem.</p>

  <div id="error-msg" class="error-msg" style="display:none;"></div>
  <div id="success-msg" class="success-msg" style="display:none;"></div>

  <div id="form-container">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" name="username" placeholder="Masukkan username anda..." required />
    </div>
    <button type="button" id="btn-hantar" class="btn-submit">Hantar Permintaan</button>
  </div>

  <a href="../index.html" class="btn-back" style="display:flex;align-items:center;justify-content:center;margin-top:10px;text-decoration:none;">← Kembali Login</a>
</div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('btn-hantar').addEventListener('click', function() {
    const errorEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const users = Store.get(STORAGE_KEYS.USERS, []);
    const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if (!user) {
      errorEl.textContent = "[ ERROR ] Username tidak dijumpai dalam sistem.";
      errorEl.style.display = 'block';
      return;
    }

    const requests = Store.get(STORAGE_KEYS.RESET_REQUESTS, []);
    const existing = requests.find(r => r.user_id === user.id && r.status === 'pending');

    if (existing) {
      errorEl.textContent = "[ AMARAN ] Permintaan reset anda sedang dalam proses. Sila hubungi admin.";
      errorEl.style.display = 'block';
    } else {
      const newReq = {
        id: Store.getNextId(STORAGE_KEYS.RESET_REQUESTS),
        user_id: user.id,
        status: 'pending',
        created_at: new Date().toISOString()
      };
      requests.push(newReq);
      Store.set(STORAGE_KEYS.RESET_REQUESTS, requests);

      successEl.textContent = "[ OK ] Permintaan telah dihantar. Hubungi admin untuk dapatkan kata laluan baru.";
      successEl.style.display = 'block';
      document.getElementById('form-container').style.display = 'none';
    }
  });
</script>

</body>
</html>
