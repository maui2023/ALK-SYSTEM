<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password | ALK System</title>
  <link rel="stylesheet" href="../css/forgot_password.css">
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>🔑 Lupa Kata Laluan?</h1>
    <p>Masukkan username anda untuk hantar permintaan reset.</p>
  </div>

  <div class="divider"></div>

  <div id="error-msg" class="error-msg" style="display:none;"></div>
  <div id="success-msg" class="success-msg" style="display:none;"></div>

  <div id="form-container">
    <div class="info-box">
      ℹ️ Admin akan reset password anda dan memberitahu password baru secara terus.
    </div>

    <form id="form-forgot">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username anda..." required />
      </div>
      <button type="submit" class="btn-submit">Hantar Permintaan</button>
    </form>
  </div>

  <a href="../index.html" class="back-link">← Kembali ke Login</a>
</div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('form-forgot').addEventListener('submit', function(e) {
    e.preventDefault();
    const errorEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const users = Store.get(STORAGE_KEYS.USERS, []);
    const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if (!user) {
      errorEl.textContent = "❌ Username tidak dijumpai.";
      errorEl.style.display = 'block';
      return;
    }

    const requests = Store.get(STORAGE_KEYS.RESET_REQUESTS, []);
    const existing = requests.find(r => r.user_id === user.id && r.status === 'pending');

    if (existing) {
      errorEl.textContent = "⚠️ Permintaan reset password anda sedang dalam proses. Sila hubungi admin.";
      errorEl.style.display = 'block';
    } else {
      const newReq = {
        id: Store.getNextId(STORAGE_KEYS.RESET_REQUESTS),
        user_id: user.id,
        status: 'pending',
        created_at: new Date().toISOString()
      };
      requests.push(newReq);
      Store.set(STORAGE_KEYS.RESET_REQUESTS, requests);

      successEl.textContent = "✅ Permintaan anda telah dihantar! Sila hubungi admin untuk dapatkan password baru.";
      successEl.style.display = 'block';
      document.getElementById('form-container').style.display = 'none';
    }
  });
</script>

</body>
</html>
