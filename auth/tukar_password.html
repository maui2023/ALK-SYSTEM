<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tukar Password | ALK System</title>
  <link rel="stylesheet" href="../css/tukar_password.css">
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>🔐 Tukar Password</h1>
    <p>Sila tukar password anda sebelum teruskan.</p>
  </div>

  <div class="divider"></div>

  <div id="error-msg" class="error-msg" style="display:none;"></div>
  <div id="success-msg" class="success-msg" style="display:none;"></div>

  <div class="info-box">
    ⚠️ Password mesti <strong>6 digit nombor</strong> sahaja. Contoh: <strong>382947</strong>
  </div>

  <form id="form-tukar-password">

    <div class="field">
      <label>Password Baru</label>
      <input type="password" id="password_baru" name="password_baru" maxlength="6" placeholder="6 digit nombor" required />
    </div>

    <div class="field">
      <label>Sahkan Password</label>
      <input type="password" id="password_confirm" name="password_confirm" maxlength="6" placeholder="6 digit nombor" required />
    </div>

    <button type="submit" class="btn-submit">Simpan Password</button>

  </form>
</div>

<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  Auth.requireAuth();

  document.getElementById('form-tukar-password').addEventListener('submit', function(e) {
    e.preventDefault();
    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none';

    const p1 = document.getElementById('password_baru').value;
    const p2 = document.getElementById('password_confirm').value;

    if (!/^\d{6}$/.test(p1)) {
      errorEl.textContent = "❌ Password mesti 6 digit nombor sahaja.";
      errorEl.style.display = 'block';
    } else if (p1 !== p2) {
      errorEl.textContent = "❌ Password tidak sepadan. Sila cuba semula.";
      errorEl.style.display = 'block';
    } else {
      Auth.changePassword(p1);
    }
  });
</script>

</body>
</html>
